<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470">
  <style>
    .title{font:700 24px Arial,sans-serif;fill:#17212b}.panel{font:700 19px Arial,sans-serif;fill:#253746}
