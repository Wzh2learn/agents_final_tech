    .edge{stroke:#647381;stroke-width:1.5}.label{font:15px Arial,sans-serif;fill:#17212b;text-anchor:middle}.note{font:14px Arial,sans-serif;fill:#50606f;text-anchor:middle}
  </style>
  <rect width="1400" height="470" fill="white"/>
