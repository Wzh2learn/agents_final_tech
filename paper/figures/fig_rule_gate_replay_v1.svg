<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Shared-stream state-dependent rule-gate replay</title>
  <desc id="desc">A method diagram showing one frozen candidate stream replayed by seven independent rule-state arms. Each arm recomputes source gain, proposal collateral, and independent gate-validation change from its current state. Accepted rules create versioned snapshots; the rollback arm restores the best validation snapshot when a frozen budget is exceeded. Sealed test and future replay remain read-only after freezing.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#263238"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#228833"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#17212b}.subtitle{font:17px Arial,sans-serif;fill:#455a64}
      .head{font:700 21px Arial,sans-serif;fill:#17212b}.body{font:17px Arial,sans-serif;fill:#263238}
      .small{font:15px Arial,sans-serif;fill:#455a64}.tiny{font:14px Arial,sans-serif;fill:#455a64}
      .box{stroke-width:2.2;rx:16;ry:16}.inner{stroke-width:1.5;rx:10;ry:10}
      .arrow{stroke:#263238;stroke-width:2.8;fill:none;marker-end:url(#arrow)}
      .green{stroke:#228833;stroke-width:2.8;fill:none;marker-end:url(#greenArrow)}
      .dash{stroke-dasharray:9 6}
    </style>
  </defs>
  <rect width="1500" height="900" fill="#ffffff"/>
  <text x="750" y="48" text-anchor="middle" class="title">State-dependent seven-arm rule-gate replay</text>
  <text x="750" y="78" text-anchor="middle" class="subtitle">Same candidate order · independent rule states · recompute before every decision</text>

  <rect x="45" y="125" width="260" height="225" class="box" fill="#f3f5f7" stroke="#607d8b"/>
  <text x="175" y="163" text-anchor="middle" class="head">Frozen candidate stream</text>
  <text x="175" y="202" text-anchor="middle" class="body">c₁ → c₂ → ··· → cₜ</text>
  <text x="175" y="235" text-anchor="middle" class="small">proposal/train only</text>
  <text x="175" y="263" text-anchor="middle" class="small">same order hash for all arms</text>
  <text x="175" y="291" text-anchor="middle" class="small">no stored gain/collateral</text>
  <text x="175" y="319" text-anchor="middle" class="small">confidence may be missing</text>

  <rect x="350" y="112" width="285" height="250" class="box" fill="#e8f2fb" stroke="#4477aa"/>
  <text x="492" y="150" text-anchor="middle" class="head">Arm-specific state</text>
  <text x="492" y="190" text-anchor="middle" class="body">R<tspan baseline-shift="sub" font-size="12">t−1</tspan><tspan baseline-shift="super" font-size="12">(a)</tspan></text>
  <rect x="382" y="220" width="220" height="108" class="inner" fill="#ffffff" stroke="#4477aa"/>
  <text x="492" y="250" text-anchor="middle" class="small">no gate · gain-only</text>
  <text x="492" y="275" text-anchor="middle" class="small">collateral-only · confidence</text>
  <text x="492" y="300" text-anchor="middle" class="small">fixed dual · independent gate</text>
  <text x="492" y="323" text-anchor="middle" class="small">rollback-versioning</text>

  <rect x="680" y="112" width="355" height="250" class="box" fill="#fff4df" stroke="#d89000"/>
  <text x="858" y="150" text-anchor="middle" class="head">Recompute on current state</text>
  <rect x="718" y="180" width="279" height="145" class="inner" fill="#ffffff" stroke="#d89000"/>
  <text x="858" y="216" text-anchor="middle" class="body">Δs : source gain</text>
  <text x="858" y="252" text-anchor="middle" class="body">Δp : proposal collateral</text>
  <text x="858" y="288" text-anchor="middle" class="body">Δg : gate-validation change</text>
  <text x="858" y="316" text-anchor="middle" class="tiny">never reuse another arm's scores</text>

  <rect x="1080" y="112" width="370" height="250" class="box" fill="#e8f5ec" stroke="#228833"/>
  <text x="1265" y="150" text-anchor="middle" class="head">Gate and version update</text>
  <text x="1265" y="194" text-anchor="middle" class="body">Δs ≥ τ</text>
  <text x="1265" y="226" text-anchor="middle" class="body">Δp ≥ −ε</text>
  <text x="1265" y="258" text-anchor="middle" class="body">Δg ≥ −η</text>
  <text x="1265" y="296" text-anchor="middle" class="small">accept → snapshot R<tspan baseline-shift="sub" font-size="11">t</tspan></text>
  <text x="1265" y="326" text-anchor="middle" class="small">budget breach → restore best R*</text>

  <path d="M305 237 H350" class="arrow"/>
  <path d="M635 237 H680" class="arrow"/>
  <path d="M1035 237 H1080" class="arrow"/>
  <path d="M1265 362 V410 H492 V362" class="green"/>
  <text x="875" y="402" text-anchor="middle" class="tiny">next candidate uses the updated state of that arm only</text>

  <rect x="45" y="475" width="1405" height="250" class="box" fill="#fafafa" stroke="#90a4ae"/>
  <text x="750" y="514" text-anchor="middle" class="head">Data-role firewall</text>
  <rect x="80" y="550" width="280" height="120" class="inner" fill="#e8f2fb" stroke="#4477aa"/>
  <text x="220" y="583" text-anchor="middle" class="body">proposal / train</text>
  <text x="220" y="613" text-anchor="middle" class="small">candidate generation</text>
  <text x="220" y="638" text-anchor="middle" class="small">Δs and Δp</text>

  <rect x="405" y="550" width="280" height="120" class="inner" fill="#fff4df" stroke="#d89000"/>
  <text x="545" y="583" text-anchor="middle" class="body">gate-validation</text>
  <text x="545" y="613" text-anchor="middle" class="small">accept / rollback only</text>
  <text x="545" y="638" text-anchor="middle" class="small">query budget logged</text>

  <rect x="730" y="550" width="280" height="120" class="inner dash" fill="#fff8ef" stroke="#d89000"/>
  <text x="870" y="583" text-anchor="middle" class="body">sealed test</text>
  <text x="870" y="613" text-anchor="middle" class="small">one read after freeze</text>
  <text x="870" y="638" text-anchor="middle" class="small">never updates R or thresholds</text>

  <rect x="1055" y="550" width="355" height="120" class="inner dash" fill="#f2faf4" stroke="#228833"/>
  <text x="1232" y="583" text-anchor="middle" class="body">future replay</text>
  <text x="1232" y="613" text-anchor="middle" class="small">new independent UID/time batch</text>
  <text x="1232" y="638" text-anchor="middle" class="small">frozen snapshot, read-only</text>

  <path d="M220 550 V448 H175 V350" class="arrow"/>
  <path d="M545 550 V440 H858 V362" class="arrow"/>
  <path d="M870 550 V460 H1265 V362" class="arrow dash"/>

  <rect x="250" y="775" width="1000" height="62" rx="30" fill="#fff0cf" stroke="#d89000" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="750" y="801" text-anchor="middle" class="body">Software contract only — no GB10 replay or paper result yet</text>
  <text x="750" y="826" text-anchor="middle" class="small">Table 2 / Figure 4 consume independently accepted aggregate artifacts only</text>
</svg>
