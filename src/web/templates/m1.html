<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M1 对账单解析工作台</title>
    <link rel="stylesheet" href="/static/m1.css">
</head>
<body>
    <header class="topbar">
        <div>
            <p class="eyebrow">M1 Document Intelligence</p>
            <h1>M1 对账单解析工作台</h1>
        </div>
        <nav class="nav">
            <a href="/">首页</a>
            <a href="/knowledge">知识库</a>
            <a href="/chat">问答</a>
        </nav>
    </header>

    <main class="workspace">
        <!-- Pipeline status -->
        <section class="status-band" aria-label="pipeline status">
            <div class="mode">
                <span id="runMode">statement-parser</span>
                <strong id="overallStatus">待运行</strong>
            </div>
            <div id="stageRail" class="stage-rail"></div>
        </section>

        <!-- Metrics -->
        <section id="metricGrid" class="metric-grid"></section>

        <!-- Controls -->
        <section class="control-strip">
            <label class="file-button" for="fileInput" title="导入对账单文件 (TXT/PDF/XLSX/DOCX)">
                <span>Upload</span>
            </label>
            <input id="fileInput" type="file" accept=".txt,.pdf,.xlsx,.docx">
            <button id="sampleBtn" type="button" title="载入演示文本">Sample</button>
            <button id="runBtn" type="button" title="解析对账单">Run</button>
            <button id="copyBtn" type="button" title="复制M2载荷">Copy M2</button>
            <button id="downloadBtn" type="button" title="下载M2载荷">Download M2</button>
            <span id="notice" role="status"></span>
        </section>

        <!-- Three-panel result area -->
        <section class="result-grid">
            <!-- Panel 1: 标准化表格 -->
            <div class="panel tables-panel">
                <div class="panel-head">
                    <h2>标准化表格</h2>
                    <span id="tableCount">-</span>
                </div>
                <div id="tablesContainer" class="panel-body scrollable"></div>
            </div>

            <!-- Panel 2: KV 表数据 -->
            <div class="panel kv-panel">
                <div class="panel-head">
                    <h2>KV 表数据</h2>
                    <span id="kvCount">-</span>
                </div>
                <div id="kvContainer" class="panel-body scrollable"></div>
            </div>

            <!-- Panel 3: 复核面板 -->
            <div class="panel review-panel">
                <div class="panel-head">
                    <h2>复核面板</h2>
                    <span id="reviewBadge">-</span>
                </div>
                <div id="reviewContainer" class="panel-body scrollable">
                    <div id="unmappedSection"></div>
                    <div id="reconcileSection"></div>
                    <div class="confirm-strip">
                        <button id="confirmBtn" type="button" class="btn-confirm" disabled>确认无误</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/static/m1.js"></script>
</body>
</html>
