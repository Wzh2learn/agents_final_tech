<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建账规则助手 - 主页</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏦</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-display, 'Space Grotesk', 'IBM Plex Sans', 'Segoe UI', sans-serif);
            background: radial-gradient(1000px 500px at 12% -10%, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 60%),
                        radial-gradient(1000px 500px at 95% 0%, rgba(255, 231, 214, 0.35) 0%, rgba(255, 231, 214, 0) 60%),
                        linear-gradient(140deg, #0f766e 0%, #14b8a6 45%, #f97316 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 48px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 16px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 18px;
            opacity: 0.95;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.16);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        .card.primary {
            background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%);
            color: white;
        }

        .card.primary:hover {
            box-shadow: 0 12px 24px rgba(15, 118, 110, 0.35);
        }

        .card-icon {
            font-size: 64px;
            margin-bottom: 16px;
            display: block;
        }

        .card-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .card-description {
            font-size: 14px;
            opacity: 0.8;
            line-height: 1.5;
        }

        .card.primary .card-description {
            opacity: 0.95;
        }

        .card-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 12px;
        }

        .badge-primary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .badge-feature {
            background: #fed7aa;
            color: #9a3412;
        }

        .badge-basic {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .badge-advanced {
            background: #fde68a;
            color: #a16207;
        }

        .footer {
            text-align: center;
            color: white;
            opacity: 0.9;
            margin-top: 32px;
        }

        .footer a {
            color: white;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s;
        }

        .footer a:hover {
            border-bottom-color: white;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 36px;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="page-home">
    <div class="main-container">
        <div class="header">
            <h1>🏦 建账规则助手系统</h1>
            <p>基于 LangChain + LangGraph 的智能金融助手</p>
        </div>

        <div class="cards-grid">
            <!-- 主要功能：智能对话 -->
            <a href="/chat" class="card primary">
                <span class="card-icon">💬</span>
                <h2 class="card-title">智能对话</h2>
                <p class="card-description">
                    多角色对话 + 协作会话<br>
                    支持多会话管理、实时协作（WebSocket）、角色切换
                </p>
                <span class="card-badge badge-primary">Dify风格</span>
            </a>

            <!-- 基础功能：知识库管理 -->
            <a href="/knowledge" class="card">
                <span class="card-icon">📚</span>
                <h2 class="card-title">知识库管理</h2>
                <p class="card-description">
                    文档管理 + RAG配置<br>
                    分段预览、检索配置、答案溯源、智能对比
                </p>
                <span class="card-badge badge-feature">集成升级</span>
            </a>
        </div>

        <div class="footer">
            <p>
                基于 <strong>VibeCoding</strong> 原则开发 | 
                <a href="https://github.com/langchain-ai/langgraph" target="_blank">LangGraph</a> + 
                <a href="https://python.langchain.com/" target="_blank">LangChain</a>
            </p>
        </div>
    </div>
</body>
</html>
