<text x="1570" y="291" fill="#172033" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="end" xml:space="preserve">1.0000</text>
<text x="355" y="365" fill="#172033" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="end" xml:space="preserve">Non-direct leaves</text>
<rect x="390" y="331" width="930" height="44" fill="#f3f5f7" stroke="#cdd5df" stroke-width="2" rx="8" ry="8"/>
<rect x="390" y="331" width="310" height="44" fill="#9aabb4" stroke="#71858f" stroke-width="2" rx="8" ry="8"/>
<text x="1570" y="365" fill="#172033" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="end" xml:space="preserve">0.3333</text>
<text x="355" y="439" fill="#172033" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="end" xml:space="preserve">Majority baseline</text>
<rect x="390" y="405" width="930" height="44" fill="#f3f5f7" stroke="#cdd5df" stroke-width="2" rx="8" ry="8"/>
