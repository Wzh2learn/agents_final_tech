<text x="70" y="524" fill="#172033" font-family="DejaVu Sans" font-size="27" font-weight="700" text-anchor="start" xml:space="preserve">Panel B · Top-1</text>
<text x="355" y="602" fill="#172033" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="end" xml:space="preserve">Full vector</text>
<rect x="390" y="568" width="930" height="44" fill="#f3f5f7" stroke="#cdd5df" stroke-width="2" rx="8" ry="8"/>
<rect x="390" y="568" width="930" height="44" fill="#365a6b" stroke="#365a6b" stroke-width="2" rx="8" ry="8"/>
<text x="1570" y="602" fill="#172033" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="end" xml:space="preserve">1.0000</text>
<text x="355" y="676" fill="#172033" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="end" xml:space="preserve">Direct codebook</text>
<rect x="390" y="642" width="930" height="44" fill="#f3f5f7" stroke="#cdd5df" stroke-width="2" rx="8" ry="8"/>
<rect x="390" y="642" width="930" height="44" fill="#365a6b" stroke="#365a6b" stroke-width="2" rx="8" ry="8"/>
<text x="1570" y="676" fill="#172033" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="end" xml:space="preserve">1.0000</text>
<text x="355" y="750" fill="#172033" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="end" xml:space="preserve">Non-direct leaves</text>
