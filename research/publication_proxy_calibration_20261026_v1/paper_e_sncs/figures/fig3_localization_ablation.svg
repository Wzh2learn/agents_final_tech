<rect x="390" y="716" width="310" height="44" fill="#9aabb4" stroke="#71858f" stroke-width="2" rx="8" ry="8"/>
<text x="1570" y="750" fill="#172033" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="end" xml:space="preserve">0.3333</text>
<text x="355" y="824" fill="#172033" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="end" xml:space="preserve">Chance baseline</text>
<rect x="390" y="790" width="930" height="44" fill="#f3f5f7" stroke="#cdd5df" stroke-width="2" rx="8" ry="8"/>
<rect x="390" y="790" width="310" height="44" fill="#9aabb4" stroke="#71858f" stroke-width="2" rx="8" ry="8"/>
<text x="1570" y="824" fill="#172033" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="end" xml:space="preserve">0.3333</text>
<text x="800" y="907" fill="#59677a" font-family="DejaVu Sans" font-size="20" font-weight="400" text-anchor="middle" xml:space="preserve">Full and direct-codebook localization are perfect on the explicitly instrumented M/R/N observation surface. When directly targeted checkpoints are</text>
<text x="800" y="933" fill="#59677a" font-family="DejaVu Sans" font-size="20" font-weight="400" text-anchor="middle" xml:space="preserve">removed, top-1 falls to chance. The result reflects stage-aligned instrumentation, not emergent localization from the remaining hierarchy.</text>
<metadata id="required-caption">Full and direct-codebook localization are perfect on the explicitly instrumented M/R/N observation surface. When directly targeted checkpoints are removed, top-1 falls to chance. The result reflects stage-aligned instrumentation, not emergent localization from the remaining hierarchy.</metadata>
