<title>Figure 1. Measurement chain</title>
<desc>Five-stage measurement chain separating motivation, controlled failure, visibility, detection, and harm.</desc>
<rect x="39.0" y="128.0" width="1722.0" height="313.0" fill="#ffffff"/>


<rect x="55" y="180" width="310" height="245" fill="#f8fafc" stroke="#172033" stroke-width="3"/>
