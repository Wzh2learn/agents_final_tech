<text x="900" y="237" fill="#172033" font-family="DejaVu Sans" font-size="21" font-weight="700" text-anchor="middle" xml:space="preserve">VISIBILITY</text>
<text x="900" y="307" fill="#172033" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="middle" xml:space="preserve">Checkpoint visibility</text>
<text x="900" y="336" fill="#172033" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="middle" xml:space="preserve">Did any instrument</text>
<text x="900" y="365" fill="#172033" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="middle" xml:space="preserve">observe the failure?</text>
