<text x="210" y="292" fill="#172033" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="middle" xml:space="preserve">Measurement-effectiveness</text>
<text x="210" y="321" fill="#172033" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="middle" xml:space="preserve">motivation</text>
<text x="210" y="350" fill="#172033" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="middle" xml:space="preserve">NIST / long-horizon</text>
<text x="210" y="379" fill="#172033" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="middle" xml:space="preserve">service</text>
