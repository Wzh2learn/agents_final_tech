<text x="555" y="307" fill="#172033" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="middle" xml:space="preserve">Controlled failure state</text>
<text x="555" y="336" fill="#172033" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="middle" xml:space="preserve">Staged pipeline</text>
<text x="555" y="365" fill="#172033" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="middle" xml:space="preserve">perturbation</text>
