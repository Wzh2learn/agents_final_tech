<svg xmlns="http://www.w3.org/2000/svg" width="6.5in" height="3.116in" viewBox="0 0 1460 700" role="img" aria-labelledby="title desc">
<title>Measurement chain</title>
<desc>Five numbered stages in two rows: motivation, controlled failure, visibility, detection, outcome and harm.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#172033"/></marker></defs>
<rect x="0" y="0" width="1460" height="700" fill="#ffffff"/>
<rect x="40" y="70" width="430" height="200" rx="14" ry="14" fill="#f3f7fb" stroke="#172033" stroke-width="3"/>
<circle cx="70" cy="100" r="17" fill="#172033"/>
<text x="70" y="109" fill="#ffffff" font-family="DejaVu Sans" font-size="26" font-weight="700" text-anchor="middle">1</text>
<text x="98" y="109" fill="#172033" font-family="DejaVu Sans" font-size="26" font-weight="700" text-anchor="start">MOTIVATION</text>
<text x="255" y="162" fill="#172033" font-family="DejaVu Sans" font-size="24" text-anchor="middle">Measurement-effectiveness</text>
<text x="255" y="196" fill="#172033" font-family="DejaVu Sans" font-size="24" text-anchor="middle">motivation</text>
<text x="255" y="230" fill="#172033" font-family="DejaVu Sans" font-size="24" text-anchor="middle">NIST / long-horizon service</text>
<rect x="515" y="70" width="430" height="200" rx="14" ry="14" fill="#f3f7fb" stroke="#172033" stroke-width="3"/>
<circle cx="545" cy="100" r="17" fill="#172033"/>
<text x="545" y="109" fill="#ffffff" font-family="DejaVu Sans" font-size="26" font-weight="700" text-anchor="middle">2</text>
<text x="573" y="109" fill="#172033" font-family="DejaVu Sans" font-size="26" font-weight="700" text-anchor="start">CONTROLLED FAILURE</text>
<text x="730" y="162" fill="#172033" font-family="DejaVu Sans" font-size="24" text-anchor="middle">Controlled failure state</text>
<text x="730" y="196" fill="#172033" font-family="DejaVu Sans" font-size="24" text-anchor="middle">Staged pipeline</text>
<text x="730" y="230" fill="#172033" font-family="DejaVu Sans" font-size="24" text-anchor="middle">perturbation</text>
<rect x="990" y="70" width="430" height="200" rx="14" ry="14" fill="#f3f7fb" stroke="#172033" stroke-width="3"/>
<circle cx="1020" cy="100" r="17" fill="#172033"/>
<text x="1020" y="109" fill="#ffffff" font-family="DejaVu Sans" font-size="26" font-weight="700" text-anchor="middle">3</text>
<text x="1048" y="109" fill="#172033" font-family="DejaVu Sans" font-size="26" font-weight="700" text-anchor="start">VISIBILITY</text>
<text x="1205" y="162" fill="#172033" font-family="DejaVu Sans" font-size="24" text-anchor="middle">Checkpoint visibility</text>
<text x="1205" y="196" fill="#172033" font-family="DejaVu Sans" font-size="24" text-anchor="middle">Did any instrument</text>
<text x="1205" y="230" fill="#172033" font-family="DejaVu Sans" font-size="24" text-anchor="middle">observe the failure?</text>
<rect x="278" y="400" width="430" height="200" rx="14" ry="14" fill="#f3f7fb" stroke="#172033" stroke-width="3"/>
<circle cx="308" cy="430" r="17" fill="#172033"/>
<text x="308" y="439" fill="#ffffff" font-family="DejaVu Sans" font-size="26" font-weight="700" text-anchor="middle">4</text>
<text x="336" y="439" fill="#172033" font-family="DejaVu Sans" font-size="26" font-weight="700" text-anchor="start">DETECTION</text>
<text x="493" y="492" fill="#172033" font-family="DejaVu Sans" font-size="24" text-anchor="middle">Protocol detection</text>
<text x="493" y="526" fill="#172033" font-family="DejaVu Sans" font-size="24" text-anchor="middle">Did the decision rule</text>
<text x="493" y="560" fill="#172033" font-family="DejaVu Sans" font-size="24" text-anchor="middle">use that observation?</text>
<rect x="753" y="400" width="430" height="200" rx="14" ry="14" fill="#fdf6ec" stroke="#8a5a1e" stroke-width="3"/>
<circle cx="783" cy="430" r="17" fill="#8a5a1e"/>
<text x="783" y="439" fill="#ffffff" font-family="DejaVu Sans" font-size="26" font-weight="700" text-anchor="middle">5</text>
<text x="811" y="439" fill="#8a5a1e" font-family="DejaVu Sans" font-size="26" font-weight="700" text-anchor="start">OUTCOME / HARM</text>
<text x="968" y="492" fill="#172033" font-family="DejaVu Sans" font-size="24" text-anchor="middle">Outcome / harm</text>
<text x="968" y="526" fill="#172033" font-family="DejaVu Sans" font-size="24" text-anchor="middle">Consequence under</text>
<text x="968" y="560" fill="#172033" font-family="DejaVu Sans" font-size="24" text-anchor="middle">stated contract?</text>
<line x1="476" y1="140" x2="509" y2="140" stroke="#172033" stroke-width="3" marker-end="url(#a)"/>
<line x1="951" y1="140" x2="984" y2="140" stroke="#172033" stroke-width="3" marker-end="url(#a)"/>
<polyline points="1205,274 1205,340 493,340 493,392" fill="none" stroke="#172033" stroke-width="3" marker-end="url(#a)"/>
<text x="507" y="332" fill="#59677a" font-family="DejaVu Sans" font-size="20">continues</text>
<line x1="714" y1="470" x2="747" y2="470" stroke="#172033" stroke-width="3" marker-end="url(#a)"/>
</svg>
